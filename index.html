<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Blossom Books - ร้านหนังสือออนไลน์</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Sarabun', sans-serif; background: #FFF0F5; color: #2D1B20; }

  /* ===== Navbar ===== */
  nav {
    background: #fff; padding: 0 32px; height: 64px;
    display: flex; align-items: center; gap: 32px;
    border-bottom: 1px solid #FFD6E3; position: sticky; top: 0; z-index: 10;
  }
  .logo {
    display: flex; align-items: center; gap: 10px;
    font-size: 20px; font-weight: 800; color: #2D1B20; text-decoration: none;
  }
  .logo-icon {
    width: 38px; height: 38px; background: #FFF0F5; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 20px;
  }
  .nav-links { display: flex; gap: 24px; margin-left: auto; align-items: center; }
  .nav-links a {
    font-size: 14px; color: #4A2535; text-decoration: none; font-weight: 500;
    transition: color .2s;
  }
  .nav-links a:hover { color: #E8527A; }
  .cart-btn {
    background: #FFE4EE; border: none; padding: 8px 18px; border-radius: 50px;
    font-size: 13px; font-weight: 600; color: #C94070; cursor: pointer;
    display: flex; align-items: center; gap: 8px; transition: background .2s;
  }
  .cart-btn:hover { background: #FFD0DF; }
  .cart-count {
    background: #E8527A; color: #fff; border-radius: 50%;
    width: 20px; height: 20px; font-size: 11px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }

  /* ===== Hero ===== */
  .hero { text-align: center; padding: 64px 24px 48px; }
  .hero-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: #fff; border: 1px solid #FFB6CB; border-radius: 50px;
    padding: 6px 16px; font-size: 12px; font-weight: 600; color: #C94070;
    margin-bottom: 24px;
  }
  .hero h1 {
    font-size: 52px; font-weight: 800; line-height: 1.15;
    color: #2D1B20; margin-bottom: 12px;
  }
  .hero h1 span { color: #E8527A; }
  .hero p {
    font-size: 15px; color: #7A4A58; max-width: 460px;
    margin: 0 auto; line-height: 1.7;
  }

  /* ===== Catalog ===== */
  .catalog { padding: 0 24px 64px; max-width: 1200px; margin: 0 auto; }
  .filter-row { margin-bottom: 24px; }
  .filter-label { font-size: 13px; color: #7A4A58; font-weight: 500; margin-bottom: 12px; }
  .search-wrap { position: relative; margin-bottom: 20px; }
  .search-wrap::before {
    content: '🔍'; position: absolute; left: 16px; top: 50%;
    transform: translateY(-50%); font-size: 14px; opacity: .7;
  }
  .search-input {
    width: 100%; padding: 12px 16px 12px 42px;
    border: 1.5px solid #FFB6CB; border-radius: 50px;
    font-family: inherit; font-size: 14px; color: #2D1B20;
    background: #fff; outline: none; transition: border-color .2s, box-shadow .2s;
  }
  .search-input::placeholder { color: #B68A99; }
  .search-input:focus {
    border-color: #E8527A;
    box-shadow: 0 0 0 4px rgba(232, 82, 122, 0.12);
  }
  .filter-pills { display: flex; gap: 8px; flex-wrap: wrap; }
  .pill {
    padding: 8px 18px; border-radius: 50px; font-size: 13px; font-weight: 600;
    cursor: pointer; border: 1.5px solid transparent; transition: all .2s;
    background: #fff; color: #4A2535; border-color: #FFB6CB;
  }
  .pill:hover { border-color: #E8527A; color: #E8527A; }
  .pill.active { background: #E8527A; color: #fff; border-color: #E8527A; }

  .books-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 20px;
  }
  .book-card {
    background: #fff; border-radius: 16px; overflow: hidden;
    border: 1px solid #FFE0EA; transition: transform .25s, box-shadow .25s;
    display: flex; flex-direction: column;
  }
  .book-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 12px 24px rgba(232, 82, 122, 0.15);
  }
  .book-img {
    height: 200px; display: flex; align-items: center; justify-content: center;
    font-size: 64px; position: relative; background: #FFF0F5;
  }
  .badge {
    position: absolute; top: 10px; right: 10px;
    padding: 4px 10px; border-radius: 50px;
    font-size: 11px; font-weight: 700; color: #fff;
  }
  .badge-red { background: #E8527A; }
  .badge-orange { background: #FF8B47; }
  .badge-green { background: #4CAF7D; }

  .book-info { padding: 14px 16px 16px; flex: 1; display: flex; flex-direction: column; }
  .book-title {
    font-size: 14px; font-weight: 700; color: #2D1B20;
    line-height: 1.4; margin-bottom: 4px;
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .book-author { font-size: 12px; color: #7A4A58; margin-bottom: 12px; }
  .book-bottom {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: auto;
  }
  .book-price { font-size: 16px; font-weight: 800; color: #E8527A; }
  .add-btn {
    background: #E8527A; color: #fff; border: none;
    width: 32px; height: 32px; border-radius: 50%;
    font-size: 18px; font-weight: 700; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform .15s, background .2s;
  }
  .add-btn:hover { background: #C94070; transform: scale(1.1); }
  .add-btn:active { transform: scale(0.95); }

  .empty {
    text-align: center; padding: 48px; color: #7A4A58;
    grid-column: 1 / -1; font-size: 14px;
  }

  @media (max-width: 600px) {
    nav { padding: 0 16px; gap: 12px; }
    .nav-links { gap: 12px; }
    .nav-links a { display: none; }
    .hero h1 { font-size: 36px; }
    .books-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  }
</style>
</head>
<body>

<!-- Navbar -->
<nav>
  <a href="#" class="logo">
    <span class="logo-icon">🌸</span>
    Blossom Books
  </a>
  <div class="nav-links">
    <a href="#">หน้าแรก</a>
    <a href="#">หนังสือ</a>
    <a href="#">โปรโมชั่น</a>
    <a href="#">ติดต่อ</a>
    <button class="cart-btn">
      🛒 ตะกร้า <span class="cart-count" id="cartCount">0</span>
    </button>
  </div>
</nav>

<!-- Hero -->
<section class="hero">
  <div class="hero-badge">✨ ยินดีต้อนรับสู่ร้านหนังสือออนไลน์</div>
  <h1>ค้นพบโลก<span>หนังสือ</span><br/>ในแบบของคุณ</h1>
  <p>คัดสรรหนังสือคุณภาพ ทั้งธรรมะ บาลี ตำราเรียน และวิชาการ ส่งตรงถึงบ้านคุณด้วยใจ 💖</p>
</section>

<!-- Catalog -->
<section class="catalog">
<section class="catalog">
  <div class="search-wrap">
    <input type="text" id="searchInput" class="search-input" placeholder="ค้นหาชื่อหนังสือหรือผู้เขียน..." />
  </div>
  <div class="filter-row">
    <div class="filter-label">หมวดหมู่หนังสือ</div>
    <div class="filter-pills" id="filterPills">
      <button class="pill active" data-cat="ทั้งหมด">ทั้งหมด</button>
      <button class="pill" data-cat="E-Book">E-Book</button>
      <button class="pill" data-cat="นักธรรม">นักธรรม</button>
      <button class="pill" data-cat="บาลี">บาลี</button>
      <button class="pill" data-cat="ตำราเรียน">ตำราเรียน</button>
      <button class="pill" data-cat="วิชาการ">วิชาการ</button>
    </div>
  </div>
  <div class="books-grid" id="booksGrid"></div>
</section>

<script>
  // ===== Data =====
  const books = [
    { id: 1,  title: 'ธรรมะเพื่อชีวิต',       author: 'พระอาจารย์สมชาย', price: 180, category: 'นักธรรม',  emoji: '📕', badge: 'แนะนำ' },
    { id: 2,  title: 'บาลีไวยากรณ์ฉบับสมบูรณ์', author: 'อ.วิเชียร',       price: 320, category: 'บาลี',     emoji: '📗', badge: 'Hot' },
    { id: 3,  title: 'คณิตศาสตร์ ม.6',        author: 'ทีมติวเตอร์',     price: 250, category: 'ตำราเรียน', emoji: '📘', badge: 'ใหม่' },
    { id: 4,  title: 'จิตวิทยาเชิงบวก',       author: 'ดร.ณัฐพล',         price: 290, category: 'วิชาการ',  emoji: '📙', badge: null   },
    { id: 5,  title: 'นักธรรมชั้นตรี',         author: 'มหาเถรสมาคม',     price: 150, category: 'นักธรรม',  emoji: '📔', badge: 'แนะนำ' },
    { id: 6,  title: 'E-Book การเขียนโค้ด',    author: 'John Dev',         price: 199, category: 'E-Book',   emoji: '💻', badge: 'ใหม่' },
    { id: 7,  title: 'พจนานุกรมบาลี-ไทย',     author: 'ราชบัณฑิต',        price: 450, category: 'บาลี',     emoji: '📚', badge: null   },
    { id: 8,  title: 'ฟิสิกส์ ม.ปลาย',        author: 'อ.ประยุทธ',        price: 280, category: 'ตำราเรียน', emoji: '📖', badge: 'Hot' },
    { id: 9,  title: 'การวิจัยเชิงคุณภาพ',    author: 'ศ.ดร.อรุณ',        price: 380, category: 'วิชาการ',  emoji: '📓', badge: null   },
    { id: 10, title: 'E-Book สมาธิเบื้องต้น',  author: 'พระมหาวุฒิชัย',   price: 99,  category: 'E-Book',   emoji: '🧘', badge: 'แนะนำ' },
    { id: 11, title: 'ภาษาอังกฤษเพื่อการสื่อสาร', author: 'Sarah Smith',  price: 220, category: 'ตำราเรียน', emoji: '📕', badge: 'ใหม่' },
    { id: 12, title: 'ปรัชญาตะวันออก',         author: 'รศ.ธีระ',          price: 340, category: 'วิชาการ',  emoji: '📗', badge: 'Hot' },
  ];

  let currentFilter = 'ทั้งหมด';
  let searchQuery = '';
  let cartCount = 0;

  const grid = document.getElementById('booksGrid');
  const cartCountEl = document.getElementById('cartCount');
  const pills = document.getElementById('filterPills');
  const searchInput = document.getElementById('searchInput');

  function badgeClass(b) {
    if (b === 'Hot') return 'badge badge-red';
    if (b === 'ใหม่') return 'badge badge-orange';
    if (b === 'แนะนำ') return 'badge badge-green';
    return '';
  }

  function render() {
    const q = searchQuery.trim().toLowerCase();
    const list = books.filter(b => {
      const matchCat = currentFilter === 'ทั้งหมด' || b.category === currentFilter;
      const matchSearch = !q
        || b.title.toLowerCase().includes(q)
        || b.author.toLowerCase().includes(q);
      return matchCat && matchSearch;
    });

    if (list.length === 0) {
      grid.innerHTML = '<div class="empty">ไม่พบหนังสือที่ค้นหา 😢</div>';
      return;
    }

    grid.innerHTML = list.map(b => `
      <div class="book-card">
        <div class="book-img">
          ${b.emoji}
          ${b.badge ? `<span class="${badgeClass(b.badge)}">${b.badge}</span>` : ''}
        </div>
        <div class="book-info">
          <div class="book-title">${b.title}</div>
          <div class="book-author">โดย ${b.author}</div>
          <div class="book-bottom">
            <div class="book-price">฿${b.price}</div>
            <button class="add-btn" data-id="${b.id}" title="เพิ่มเข้าตะกร้า">+</button>
          </div>
        </div>
      </div>
    `).join('');
  }

  // Filter
  pills.addEventListener('click', e => {
    const btn = e.target.closest('.pill');
    if (!btn) return;
    document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.cat;
    render();
  });

  // Search
  searchInput.addEventListener('input', e => {
    searchQuery = e.target.value;
    render();
  });

  // Add to cart
  grid.addEventListener('click', e => {
    const btn = e.target.closest('.add-btn');
    if (!btn) return;
    cartCount++;
    cartCountEl.textContent = cartCount;
    cartCountEl.animate(
      [{ transform: 'scale(1)' }, { transform: 'scale(1.4)' }, { transform: 'scale(1)' }],
      { duration: 300 }
    );
  });

  render();
</script>

</body>
</html>
